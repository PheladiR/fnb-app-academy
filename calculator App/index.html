<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Document</title>
</head>
<body>
    <table>
<tr>
    <td colspan="4">
      <input type="text" id="inputBox" value="0"/>
    </td>
</tr>
<tr>
    <td onclick="digitalBtnPressed(7)">7</td>
    <td onclick="digitalBtnPressed(8)">8</td>
    <td onclick="digitalBtnPressed(9)">9</td>
    <td onclick='operatorBtnPressed("*")'>x</td>
</tr>
<tr>
    <td onclick="digitalBtnPressed(4)">4</td>
    <td onclick="digitalBtnPressed(5)">5</td>
    <td onclick="digitalBtnPressed(6)">6</td>
    <td onclick='operatorBtnPressed("-")'>-</td>
</tr>
<tr>
    <td onclick="digitalBtnPressed(1)">1</td>
    <td onclick="digitalBtnPressed(2)">2</td>
    <td onclick="digitalBtnPressed(3)">3</td>
    <td onclick='operatorBtnPressed("+")'>+</td>
</tr>
<tr>
    <td colspan="2" onclick='digitalBtnPressed(0)'>0</td>
    <td onclick="btnAcPressed()">AC</td>
    <td onclick='operatorBtnPressed("/")'>/</td>
</tr>
<tr>
    <td colspan="4" onclick='equalsBtnPressed("=")'>=</td>
</tr>
    </table>
    <script>
        var newLine = true // what user types will be on a new line
       var value1;
       var currentOperator;

       function digitalBtnPressed(button) {
    let inputBox = document.getElementById("inputBox");

    if (newLine) {
        inputBox.value = button;
        newLine = false;
    } else {
        let currentValue = inputBox.value;
        if (currentValue === "0" && button !== "0") {
            inputBox.value = button;
        } else {
            inputBox.value = currentValue + button;
        }
    }
}

        function btnAcPressed(){
            document.getElementById("inputBox").value = 0;
            newLine = true;
        }

        function operatorBtnPressed(operator){
            currentOperator = operator;
            value1 = parseInt(document.getElementById("inputBox").value);
            newLine = true;
        }

        function equalsBtnPressed(operator){
            
            value2 = parseInt(document.getElementById("inputBox").value);
            var finalTotal;

            switch(currentOperator){
                case "+": 
                finalTotal = value1 + value2;
                break;
                case "-": 
                finalTotal = value1 - value2;
                break;
                case "*": 
                finalTotal = value1 *  value2;
                break;

                case "/": 
                finalTotal = value1 / value2;
                break;
            }

        document.getElementById("inputBox").value = finalTotal;
        value1=0;
        newLine = true;
    }
    </script>
    
</body>
</html>
