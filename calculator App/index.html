<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css" />
  <title>Calculator app</title>
</head>
<body>
  <div class="calculator">
    <table>
      <tr>
        <td colspan="4" id="screen">
          <input type="text" id="inputBox" value="0" />
        </td>
      </tr>
      <tr>
        <td class="acBtn" onclick="btnAcPressed()">AC</td>
        <td class="operatorBtn" onclick="percentBtnPressed()">%</td>
        <td class="operatorBtn" onclick="sqrtBtnPressed()">√</td>
        <td class="operatorBtn" onclick='operatorBtnPressed("/")' id="division">/</td>
      </tr>
      <tr>
        <td class="digitalBtn" onclick="digitalBtnPressed(7)">7</td>
        <td class="digitalBtn" onclick="digitalBtnPressed(8)">8</td>
        <td class="digitalBtn" onclick="digitalBtnPressed(9)">9</td>
        <td class="operatorBtn" onclick='operatorBtnPressed("*")' id="multiply">x</td>
      </tr>
      <tr>
        <td class="digitalBtn" onclick="digitalBtnPressed(4)">4</td>
        <td class="digitalBtn" onclick="digitalBtnPressed(5)">5</td>
        <td class="digitalBtn" onclick="digitalBtnPressed(6)">6</td>
        <td class="operatorBtn" onclick='operatorBtnPressed("-")' id="minus">-</td>
      </tr>
      <tr>
        <td class="digitalBtn" onclick="digitalBtnPressed(1)">1</td>
        <td class="digitalBtn" onclick="digitalBtnPressed(2)">2</td>
        <td class="digitalBtn" onclick="digitalBtnPressed(3)">3</td>
        <td class="operatorBtn" onclick='operatorBtnPressed("+")' id="plus" rowspan="2">+</td>
      </tr>
      <tr>
        <td class="digitalBtn" onclick="digitalBtnPressed(0)">0</td>
        <td class="digitalBtn" onclick='decimalPressed()'>.</td>
        <td class="equalBtn" onclick='equalsBtnPressed()'>=</td>
      </tr>
    </table>
  </div>
  <footer>This project was made by <a href="https://github.com/PheladiR">Pheladi Rachoshi </a>and it's hosted on <a href="https://the-pink-calculator.netlify.app/">Netlify</a></footer>
  <script>
    let newLine = true;
    let value1 = null;
    let currentOperator = null;

    function digitalBtnPressed(button) {
      let inputBox = document.getElementById("inputBox");
      if (newLine || inputBox.value === "0") {
        inputBox.value = button;
        newLine = false;
      } else {
        inputBox.value += button;
      }
    }

    function decimalPressed() {
      let inputBox = document.getElementById("inputBox");
      if (newLine) {
        inputBox.value = "0.";
        newLine = false;
      } else if (!inputBox.value.includes(".")) {
        inputBox.value += ".";
      }
    }

    function btnAcPressed() {
      document.getElementById("inputBox").value = "0";
      newLine = true;
      value1 = null;
      currentOperator = null;
    }

    function percentBtnPressed() {
      let inputBox = document.getElementById("inputBox");
      let val = parseFloat(inputBox.value);
      inputBox.value = (val / 100).toString();
      newLine = true;
    }

    function sqrtBtnPressed() {
      let inputBox = document.getElementById("inputBox");
      let val = parseFloat(inputBox.value);
      inputBox.value = Math.sqrt(val).toFixed(6);
      newLine = true;
    }

    function operatorBtnPressed(operator) {
      value1 = parseFloat(document.getElementById("inputBox").value);
      currentOperator = operator;
      newLine = true;
    }

    function equalsBtnPressed() {
      let value2 = parseFloat(document.getElementById("inputBox").value);
      let result;

      if (currentOperator === null || value1 === null) {
        return;
      }

      switch (currentOperator) {
        case "+":
          result = value1 + value2;
          break;
        case "-":
          result = value1 - value2;
          break;
        case "*":
          result = value1 * value2;
          break;
        case "/":
          result = value2 !== 0 ? (value1 / value2) : "Error";
          break;
        default:
          result = value2;
      }

      document.getElementById("inputBox").value = isNaN(result) ? "Error" : result.toString();
      value1 = null;
      currentOperator = null;
      newLine = true;
    }
  </script>
</body>
</html>
